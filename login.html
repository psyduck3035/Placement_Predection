{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<section class="form-shell"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p class="muted">Continue your placement-readiness journey.</p>
<form method="post" class="form-card"><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary full" type="submit">Sign in</button></form><p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p></section>
{% endblock %}
