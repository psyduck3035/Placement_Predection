services:
  - type: web
    name: pathpilot-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE_FALLBACK
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
