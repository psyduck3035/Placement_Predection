{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<section class="form-shell"><p class="eyebrow">START YOUR JOURNEY</p><h1>Create your account</h1><p class="muted">Create your account and start your student profile.</p>
<form method="post" class="form-card"><label>Full name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small></label>
<label>University name<input name="university" value="University of Mumbai" maxlength="190" required></label>
<label>Faculty / stream<select name="stream"><option>Science</option><option>Commerce</option><option>Arts</option><option>Engineering & Technology</option><option>Management</option><option>Other</option></select></label>
<label>Degree / programme<select name="degree">{% for degree in ['B.Sc. Computer Science','B.Sc. Information Technology','B.Sc. Data Science','B.Sc. Biotechnology','B.Sc. Microbiology','B.Sc. Physics','B.Sc. Chemistry','B.Sc. Mathematics','B.Sc. Statistics','B.Sc. Life Sciences','B.Sc. Electronics','B.Sc. Environmental Science','B.Sc. Botany','B.Sc. Zoology','B.Sc. Geology','B.Sc. Bioinformatics','B.Sc. Forensic Science','Other Science programme'] %}<option>{{ degree }}</option>{% endfor %}</select></label>
<button class="btn primary full" type="submit">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>
{% endblock %}
